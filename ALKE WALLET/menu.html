
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark wallet-navbar">

        <div class="container">

                

            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-wallet2"></i>
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarDashboard"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarDashboard">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Transferir
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

                <a href="login.html" class="btn btn-outline-light ms-lg-4">
                    Salir
                </a>

            </div>

        </div>

    </nav>

    <!-- DASHBOARD -->

    <section class="dashboard-section py-5">

        <div class="container">

            <!-- HEADER -->

            <div class="dashboard-header mb-5">

                <h2 id="userName"></h2>


                <p class="text-light opacity-75">
                    Gestiona tus finanzas de forma rápida y segura.
                </p>

            </div>

            <!-- TARJETAS -->

            <div class="row g-4">

                <!-- SALDO -->

                <div class="col-lg-6">

                    <div class="dashboard-card balance-card">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="card-label">
                                    Saldo disponible
                                </p>

                                <h1 id="userBalance"></h1>

                            </div>

                            <div class="dashboard-icon">
                                <i class="bi bi-cash-stack"></i>
                            </div>

                        </div>

                    </div>

                </div>

                

                

            </div>

            <!-- ACCIONES -->

            <div class="row mt-5 g-4">

                <div class="col-md-4">

                    <a href="deposit.html" class="action-card text-decoration-none">

                        <i class="bi bi-plus-circle"></i>

                        <h4 class="mt-4">
                            Depositar
                        </h4>

                        <p>
                            Agrega fondos a tu cuenta.
                        </p>

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="sendmoney.html" class="action-card text-decoration-none">

                        <i class="bi bi-send"></i>

                        <h4 class="mt-4">
                            Transferir
                        </h4>

                        <p>
                            Envía dinero rápidamente.
                        </p>

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="transactions.html" class="action-card text-decoration-none">

                        <i class="bi bi-clock-history"></i>

                        <h4 class="mt-4">
                            Movimientos
                        </h4>

                        <p>
                            Revisa tus transacciones.
                        </p>

                    </a>

                </div>

            </div>

            
<!-- MOVIMIENTOS -->

<div class="dashboard-card mt-5 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3 class="fw-bold">
            Últimos movimientos
        </h3>

        <a href="transactions.html" class="text-info text-decoration-none">
            Ver todos
        </a>

    </div>

    <!-- CONTENEDOR DINÁMICO -->

    <div id="recentTransactions">

    </div>

</div>



        </div>

    </section>

    <!-- JQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="assets/js/menu.js"></script>

</body>
</html>
