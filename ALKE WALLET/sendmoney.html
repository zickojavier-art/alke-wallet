
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Transferencias</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark wallet-navbar">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                <i class="bi bi-wallet2"></i>
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSend"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarSend">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="sendmoney.html">
                            Transferir
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- SECTION -->

    <section class="send-section py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="dashboard-card">

                        <!-- HEADER -->

                        <div class="text-center mb-5">

                            <div class="send-icon mb-4">

                                <i class="bi bi-send-fill"></i>

                            </div>

                            <h1 class="fw-bold">
                                Transferir dinero
                            </h1>

                            <p class="text-light opacity-75">
                                Envía fondos rápidamente y de forma segura.
                            </p>

                        </div>

                        <!-- SALDO -->

                        <div class="current-balance mb-4">

                            <p>
                                Saldo disponible
                            </p>

                            <h2 id="availableBalance">
                                $1.500.000
                            </h2>

                        </div>

                        <!-- FORM -->

                        <form id="sendForm">

                            <!-- CONTACTO -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Buscar contacto
                                </label>

                                <input
                                    type="text"
                                    class="form-control custom-input"
                                    id="contactSearch"
                                    placeholder="Ej: Juan Pérez"
                                    autocomplete="off"
                                >

                                <div id="contactList"></div>

                            </div>

                            <!-- NUEVO CONTACTO -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Nuevo contacto
                                </label>

                                <div class="d-flex gap-2">

                                    <input
                                        type="text"
                                        class="form-control custom-input"
                                        id="newContact"
                                        placeholder="Agregar contacto"
                                    >

                                    <button
                                        type="button"
                                        class="btn wallet-btn"
                                        id="addContactBtn"
                                    >

                                        +

                                    </button>

                                </div>

                            </div>

                            <!-- MONTO -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Monto a transferir
                                </label>

                                <input
                                    type="number"
                                    class="form-control custom-input"
                                    id="sendAmount"
                                    placeholder="Ingresa el monto"
                                >

                            </div>

                            <!-- BUTTON -->

                            <button
                                type="submit"
                                class="btn wallet-btn w-100"
                            >

                                Realizar transferencia

                            </button>

                        </form>

                        <!-- MESSAGE -->

                        <div id="sendMessage" class="mt-4 text-center"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- JQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="assets/js/sendmoney.js"></script>

</body>
</html>
