<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Alke Wallet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-body d-flex align-items-center justify-content-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-8">

                <div class="wallet-card p-5">
<a href="index.html" class="btn btn-outline-light btn-sm position-absolute m-3">
    <i class="bi bi-arrow-left"></i> Volver
</a>
                    <div class="logo-circle mb-4">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>

                    <h2 class="text-center mb-4">
                        Crear Cuenta
                    </h2>

                    <form id="signupForm">

                        <div class="mb-3">
                            <input
                                type="text"
                                id="name"
                                class="form-control custom-input"
                                placeholder="Nombre completo"
                                required>
                        </div>

                        <div class="mb-3">
                            <input
                                type="email"
                                id="email"
                                class="form-control custom-input"
                                placeholder="Correo electrónico"
                                required>
                        </div>

                        <div class="mb-3">
                            <input
                                type="password"
                                id="password"
                                class="form-control custom-input"
                                placeholder="Contraseña"
                                required>
                        </div>

                        <div class="mb-4">
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control custom-input"
                                placeholder="Confirmar contraseña"
                                required>
                        </div>

                        <button type="submit" class="wallet-btn w-100">
                            Registrarse
                        </button>

                    </form>

                    <p id="message" class="text-center mt-4"></p>

                    <div class="text-center mt-3">
                        <a href="login.html" class="text-light">
                            ¿Ya tienes cuenta? Inicia sesión
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

<script src="assets/js/signup.js"></script>
</body>
</html>
