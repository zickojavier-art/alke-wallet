
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Movimientos</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark wallet-navbar">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                <i class="bi bi-wallet2"></i>
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarTransactions"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarTransactions">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Transferir
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- SECTION -->

    <section class="transactions-section py-5">

        <div class="container">

            <!-- HEADER -->

            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-5 gap-3">

                <div>

                    <h1 class="fw-bold">
                        Últimos movimientos
                    </h1>

                    <p class="text-light opacity-75">
                        Historial completo de transacciones.
                    </p>

                </div>

                <div class="d-flex gap-3">

                    <!-- BUSCADOR -->

                    <input
                        type="text"
                        class="form-control custom-input search-input"
                        id="searchTransaction"
                        placeholder="Buscar movimiento"
                    >

                    <!-- BOTON -->

                    <button
                        class="btn btn-danger"
                        id="clearHistoryBtn"
                    >

                        Vaciar

                    </button>

                </div>

            </div>

            <!-- TABLA -->

            <div class="dashboard-card">

                <div class="table-responsive">

                    <table class="table align-middle table-dark table-hover">

                        <thead>

                            <tr>

                                <th>Tipo</th>
                                <th>Contacto</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th>Monto</th>

                            </tr>

                        </thead>

                        <tbody id="transactionsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>

    <!-- JQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="assets/js/transactions.js"></script>

</body>
</html>
