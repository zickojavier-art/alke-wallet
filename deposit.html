
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Depositar</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark wallet-navbar">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                <i class="bi bi-wallet2"></i>
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarDeposit"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarDeposit">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Transferir
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- SECTION -->

    <section class="deposit-section py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="dashboard-card">

                        <!-- HEADER -->

                        <div class="text-center mb-5">

                            <div class="deposit-icon mb-4">
                                <i class="bi bi-plus-circle"></i>
                            </div>

                            <h1 class="fw-bold">
                                Realizar depósito
                            </h1>

                            <p class="text-light opacity-75">
                                Agrega fondos a tu cuenta digital.
                            </p>

                        </div>

                        <!-- SALDO -->

                        <div class="current-balance mb-4">

                            <p>
                                Saldo actual
                            </p>

                            <h2 id="currentBalance">
                                $1.500.000
                            </h2>

                        </div>

                        <!-- FORM -->

                        <form id="depositForm">

                            <div class="mb-4">

                                <label class="form-label">
                                    Monto a depositar
                                </label>

                                <input
                                    type="number"
                                    class="form-control custom-input"
                                    id="depositAmount"
                                    placeholder="Ingresa el monto"
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn wallet-btn w-100"
                            >

                                Realizar depósito

                            </button>

                        </form>

                        <!-- MESSAGE -->

                        <div id="depositMessage" class="mt-4 text-center"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- JQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="assets/js/deposit.js"></script>

</body>
</html>
